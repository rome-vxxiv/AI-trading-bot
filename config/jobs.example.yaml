# Scheduled jobs: strategy x instrument x cadence tier. Each `enabled: true`
# entry is registered by scheduler/app.py at boot as a CronTrigger job.
# Session gating (open/closed, guards, holidays) is evaluated INSIDE each
# tick, not here -- an enabled job still correctly no-ops most ticks when
# its instrument's market is shut.
#
# `tiers` IS read (not decorative) -- minutes controls the cron-minute
# spacing within each hour. Must divide evenly into 60.

tiers:
  fast:   { minutes: 5  }
  medium: { minutes: 15 }
  slow:   { minutes: 60 }

jobs:
  - id: rsi_gold_15m
    enabled: true
    strategy: rsi_mean_reversion
    epic: GOLD
    tier: medium

  - id: rsi_btcusd_15m
    enabled: true
    strategy: rsi_mean_reversion
    epic: BTCUSD
    tier: medium

  - id: rsi_us500_15m
    enabled: true
    strategy: rsi_mean_reversion
    epic: US500
    tier: medium

  - id: rsi_googl_15m
    enabled: true
    strategy: rsi_mean_reversion
    epic: GOOGL
    tier: medium

  - id: rsi_msft_15m
    enabled: true
    strategy: rsi_mean_reversion
    epic: MSFT
    tier: medium

  - id: rsi_nvda_15m
    enabled: true
    strategy: rsi_mean_reversion
    epic: NVDA
    tier: medium
