# Full-stack compose. The scheduler container spawns capital-mcp as an
# in-process stdio subprocess, so there's no separate MCP service —
# simpler than the initial scaffold suggested.
#
# Usage on a VPS:
#   cp .env.example .env && $EDITOR .env           # fill CAP_* + ANTHROPIC_API_KEY
#   cp config/*.example.yaml config/               # rename examples to live
#   docker compose build
#   docker compose up -d
#   docker compose logs -f agent                   # follow structured JSON events
#   curl http://127.0.0.1:8080/healthz            # sanity ping

services:

  agent:
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
      args:
        UPSTREAM_REF: main
    container_name: capital-agent
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - agent_state:/app/state
      - agent_logs:/app/logs
      # Mount config live so risk.yaml edits pick up without rebuild.
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro

volumes:
  agent_state:
  agent_logs:
